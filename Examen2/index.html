<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Document</title>
</head>
<body>
    <!-- en el body se coloca un div donde comienza todo-->
    <div class="container">
        <!-- en el header se coloca el titulo del examen,la barra superior-->
    <header>
        <h1> Examen Practico</h1>
    </header>
    <!-- en el aside se coloca la barra lateral, tambien en vez de aside puede ir un nav-->
    <aside class="sidebar">
    <h2>Barra Lateral</h2>
    </aside>
    <!-- en el main se coloca el contenido principal -->
    <main>
        <h1>CONTENIDO DE PRACTICA</h1>
        <!-- en el section se coloca el contenido de la pagina, puede ir un article o un div -->
        <section class="BarraHerramientas">
            <div class="toolbar">
               <input type="Text" placeholder="Buscar">
            <div class="botones">
                <button type="button">Inicio</button>
                <button type="button">Enviar</button> 
                <button type="button">Recibir</button>
            </div>
            </div>
        </section>
        <!-- en este section se coloca el catalogo dependiendo de lo que te piden -->
        <section class="Catalogo">
            <div class="catalog-grid">
                <article class="featured-banner">
                    <h2>Banner de Campaña Activa
                    </h2>
                    </article>
                <article class="product-card">
                    <h2>Tarjeta de producto</h2>
                </article>
                <article class="product-card">
                    <h2>Tarjeta de Producto2</h2>
                </article>
                <article class="product-card">
                    <h2>Tarjeta de Producto3</h2>
                </article>
            </div>
        </section>


    </main>

    <footer>
        <h6>Curso de Practica@2025-2026</h6>
    </footer>

</div>
</body>
</html>
